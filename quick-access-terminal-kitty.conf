# Minimal kitty config used *inside* the quick-access session-picker dropdown.
#
# The quick-access terminal would otherwise load the full kitty.conf, which
# pulls in the startup session, the custom tab bar package and every keyboard
# mode — none of which a single-window fzf picker needs. This slim config keeps
# the dropdown fast and matches the main theme/font.
#
# Referenced from quick-access-terminal.conf via `kitty_conf`.

font_family      JetBrainsMono Nerd Font
font_size        13.0
modify_font cell_height 110%

# Match the active theme of the main instance.
include current-theme.conf
