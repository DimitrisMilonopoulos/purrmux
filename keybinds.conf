# Keyboard mappings, in three tiers, arranged so kitty takes as little as
# possible from the programs running inside it:
#
#   1. ctrl+g        the leader. Everything infrequent hangs off it, so this is
#                    the only key kitty takes from your shell and editor.
#   2. alt+…         six shortcuts for the hot path — pane focus and session
#                    cycling — where a leader keystroke every time would grate.
#   3. ctrl+shift+…  kitty's own namespace; no terminal app competes for it.
#
# The leader is a keyboard mode rather than a key sequence, so `ctrl+g` is
# written exactly once — the first map below — and everything under it is a
# plain `--mode leader` binding. That is also why there are no
# `combine : … : pop_keyboard_mode` wrappers here: kitty rewrites
# `--new-mode X` into `push_keyboard_mode X`, and `--on-action end` deletes a
# mode from the stack *at its own position*, so leader removes itself as it
# hands over and esc from a submode lands back in the terminal.
#
# Per-mode flags:
#   --on-unknown end  any unbound key exits the mode, so esc, enter and a
#                     fat-fingered key all cancel — no explicit exit bindings.
#   --on-action end   one-shot: the mode exits after a single action.
#
# No mode sets --timeout, so all of them inherit kitty's map_timeout, which
# defaults to 0 — they wait indefinitely rather than dropping you out
# mid-thought, and any unbound key cancels. Set `map_timeout 2.0` in
# override.conf to make modes expire on idle instead.
#
# The tab bar shows the active mode and its keys. Those hint tables live in
# tab_bar/config.py and have to be updated alongside this file.


# ---------------------------------------------------------------------------
# Aliases — every repeated incantation spelled out once
# ---------------------------------------------------------------------------

# bin/kitty-run resolves a helper by name (bare names under
# session-management/, slashed paths against the config dir) and runs it.
#   bg     background job. --log keeps its output, which a background launch
#          would otherwise discard, leaving failures invisible.
#   picker overlay that draws its own UI, so it must not be logged — its
#          stdout is the interface.
action_alias bg     launch --type=background --copy-env --allow-remote-control $HOME/.config/kitty/bin/kitty-run --log
action_alias picker launch --type=overlay --allow-remote-control $HOME/.config/kitty/bin/kitty-run
action_alias tool   launch --type=overlay --cwd=current
action_alias split  combine : goto_layout splits : launch --cwd=current --add-to-session=.


# ---------------------------------------------------------------------------
# Tier 1 — the leader
# ---------------------------------------------------------------------------
map --new-mode leader --on-unknown end --on-action end ctrl+g

# Straight to a tool, no mode in between.
map --mode leader g tool lazygit
map --mode leader d tool lazydocker
map --mode leader b tool btop
map --mode leader / launch --type=tab --tab-title="keybinds" sh -c 'bat --color=always --style=plain --language=md "$HOME/.config/kitty/KEYBINDS.md" | less -R'

# Modes. Each line both declares the mode and binds the key that enters it, so
# a mode's name and its key never drift apart. Declaration has to precede the
# `--mode` bindings below, which kitty resolves in file order.
map --mode leader --new-mode pane           --on-unknown end p
map --mode leader --new-mode tabmode        --on-unknown end --on-action end t
map --mode leader --new-mode scrollmode     --on-unknown end s
map --mode leader --new-mode sessionmode    --on-unknown end --on-action end o
map --mode leader --new-mode appearancemode --on-unknown end a
map --mode leader --new-mode locked --on-unknown passthrough l


# ----------------------------
# PANE MODE  (leader p) — sticky
# ----------------------------
map --mode pane h neighboring_window left
map --mode pane j neighboring_window down
map --mode pane k neighboring_window up
map --mode pane l neighboring_window right

# Spelled `shift+h`, not `H`: kitty parses a bare uppercase letter as the plain
# key with no modifier, so `H` and `h` become the same trigger and the later
# binding silently wins — which is how focus-left used to be unreachable here.
map --mode pane shift+h move_window left
map --mode pane shift+j move_window down
map --mode pane shift+k move_window up
map --mode pane shift+l move_window right

map --mode pane - resize_window shorter 3
map --mode pane = resize_window taller 3
map --mode pane , resize_window narrower 3
map --mode pane . resize_window wider 3

map --mode pane v split --location=vsplit
map --mode pane s split --location=hsplit
map --mode pane f toggle_layout stack
map --mode pane x close_window

# The picker is interactive, so the mode has to get out of the way first —
# otherwise pane mode would eat the keys meant for it.
map --mode pane w combine : pop_keyboard_mode : picker tab-picker.py --auto-close --ansi


# ----------------------------
# TAB MODE  (leader t) — one-shot
# ----------------------------
map --mode tabmode n new_tab_with_cwd
map --mode tabmode x close_tab
map --mode tabmode r set_tab_title
map --mode tabmode h previous_tab
map --mode tabmode l next_tab

map --mode tabmode 1 goto_tab 1
map --mode tabmode 2 goto_tab 2
map --mode tabmode 3 goto_tab 3
map --mode tabmode 4 goto_tab 4
map --mode tabmode 5 goto_tab 5
map --mode tabmode 6 goto_tab 6
map --mode tabmode 7 goto_tab 7
map --mode tabmode 8 goto_tab 8
map --mode tabmode 9 goto_tab 9


# ----------------------------
# SCROLL MODE  (leader s) — sticky
# ----------------------------
map --mode scrollmode j scroll_line_down
map --mode scrollmode k scroll_line_up
map --mode scrollmode d scroll_page_down
map --mode scrollmode u scroll_page_up
map --mode scrollmode g scroll_home
map --mode scrollmode shift+g scroll_end


# ----------------------------
# SESSION MODE  (leader o) — one-shot
# ----------------------------
# --target=window opens each session in a new OS window; use --target=tab (or
# drop the flag) to open it as a tab in the current window instead.
map --mode sessionmode k picker kitty-zoxide-sessions.py --target=window --auto-close --ansi
map --mode sessionmode a picker attention-picker.py --ansi
map --mode sessionmode o picker agent-overview.py --ansi

# Same actions as alt+] / alt+[, listed here so the mode hints advertise them.
map --mode sessionmode ] bg cycle-session.py
map --mode sessionmode [ bg cycle-session.py --prev


# ----------------------------
# APPEARANCE MODE  (leader a) — sticky
# ----------------------------
map --mode appearancemode - set_background_opacity -0.05
map --mode appearancemode = set_background_opacity +0.05
map --mode appearancemode 0 set_background_opacity default
map --mode appearancemode v bg tab_bar/toggle-edge.py
# Takes the bar away and puts it back at the same edge. Instance-wide: it is a
# global option that hides it, so every OS window loses the bar together.
#
# The one binding here that pops the mode itself. Opacity is why this mode is
# sticky — you nudge it a step at a time — but hiding the bar is done in one
# press, and staying in the mode afterwards only swallows the next thing you
# type. `--on-action end` would say this at the mode level, but it would end
# the mode for the opacity keys too.
map --mode appearancemode b combine : bg tab_bar/toggle-edge.py toggle-hidden : pop_keyboard_mode


# ----------------------------
# LOCK MODE  (leader l)
# ----------------------------
# Unknown keys pass through to the program in the active window, which suspends
# the alt tier as well — use it when an app wants keys this config has taken.
map --mode locked ctrl+g pop_keyboard_mode


# ---------------------------------------------------------------------------
# Tier 2 — quick shortcuts for the hot path
# ---------------------------------------------------------------------------
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

map alt+] bg cycle-session.py
map alt+[ bg cycle-session.py --prev


# ---------------------------------------------------------------------------
# Tier 3 — kitty's own namespace
# ---------------------------------------------------------------------------
# New tabs and windows inherit the cwd so they stay in the current session.
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# Match the vertical tab bar's direction, replacing kitty's scroll_line_up/down
# defaults on these keys; scroll mode has j/k for that.
map ctrl+shift+up previous_tab
map ctrl+shift+down next_tab
