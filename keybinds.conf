# Optional: avoid conflicts with Kitty defaults if you want a very custom setup
# clear_all_shortcuts yes

# Override defaults so new tabs/windows belong to the current session
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# Show keybinds overlay
map ctrl+shift+slash launch --type=tab --tab-title="keybinds" sh -c 'bat --color=always --style=plain --language=md "$HOME/.config/kitty/KEYBINDS.md" | less -R'

# Global pane navigation
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# ----------------------------
# PANE MODE  (enter with alt+p)
# ----------------------------
map --new-mode pane alt+p

# Move focus between splits
map --mode pane h neighboring_window left
map --mode pane j neighboring_window down
map --mode pane k neighboring_window up
map --mode pane l neighboring_window right

# Move the current pane
map --mode pane H combine : move_window left : pop_keyboard_mode
map --mode pane J combine : move_window down : pop_keyboard_mode
map --mode pane K combine : move_window up : pop_keyboard_mode
map --mode pane L combine : move_window right : pop_keyboard_mode

# Resize the current pane
map --mode pane - resize_window shorter 3
map --mode pane = resize_window taller 3
map --mode pane , resize_window narrower 3
map --mode pane . resize_window wider 3

# Split panes in current working directory
map --mode pane v combine : goto_layout splits : launch --location=vsplit --cwd=current --add-to-session=. : pop_keyboard_mode
map --mode pane s combine : goto_layout splits : launch --location=hsplit --cwd=current --add-to-session=. : pop_keyboard_mode
map --mode pane w combine : launch --type=overlay --allow-remote-control $HOME/.config/kitty/session-management/tab-picker.py --auto-close --ansi : pop_keyboard_mode
map --mode pane g combine : launch --type=background --cwd=current --copy-env --allow-remote-control sh -c 'python3 "$HOME/.config/kitty/session-management/focus-or-launch-tool-tab.py" lazygit >> /tmp/kitty-tool-tab.log 2>&1' : pop_keyboard_mode
map --mode pane d combine : launch --type=background --cwd=current --copy-env --allow-remote-control sh -c 'python3 "$HOME/.config/kitty/session-management/focus-or-launch-tool-tab.py" lazydocker >> /tmp/kitty-tool-tab.log 2>&1' : pop_keyboard_mode

# Toggle zoom for the active pane
map --mode pane f combine : toggle_layout stack : pop_keyboard_mode

# Close pane
map --mode pane x combine : close_window : pop_keyboard_mode

# Exit pane mode
map --mode pane esc pop_keyboard_mode
map --mode pane enter pop_keyboard_mode
map --mode pane alt+p pop_keyboard_mode


# ----------------------------
# TAB MODE  (enter with alt+t)
# ----------------------------
map --new-mode tabmode alt+t

map --mode tabmode n combine : new_tab_with_cwd : pop_keyboard_mode
map --mode tabmode x combine : close_tab : pop_keyboard_mode
map --mode tabmode h previous_tab
map --mode tabmode l next_tab
map --mode tabmode r combine : set_tab_title : pop_keyboard_mode
map --mode tabmode v combine : launch --type=background --copy-env --allow-remote-control sh -c 'python3 "$HOME/.config/kitty/tab_bar/toggle-edge.py" >> /tmp/kitty-tab-bar-edge.log 2>&1' : pop_keyboard_mode

map --mode tabmode 1 combine : goto_tab 1 : pop_keyboard_mode
map --mode tabmode 2 combine : goto_tab 2 : pop_keyboard_mode
map --mode tabmode 3 combine : goto_tab 3 : pop_keyboard_mode
map --mode tabmode 4 combine : goto_tab 4 : pop_keyboard_mode
map --mode tabmode 5 combine : goto_tab 5 : pop_keyboard_mode
map --mode tabmode 6 combine : goto_tab 6 : pop_keyboard_mode
map --mode tabmode 7 combine : goto_tab 7 : pop_keyboard_mode
map --mode tabmode 8 combine : goto_tab 8 : pop_keyboard_mode
map --mode tabmode 9 combine : goto_tab 9 : pop_keyboard_mode

map --mode tabmode esc pop_keyboard_mode
map --mode tabmode enter pop_keyboard_mode
map --mode tabmode alt+t pop_keyboard_mode


# ----------------------------
# SCROLL MODE  (enter with alt+s)
# ----------------------------
map --new-mode scrollmode alt+s

map --mode scrollmode j scroll_line_down
map --mode scrollmode k scroll_line_up
map --mode scrollmode d scroll_page_down
map --mode scrollmode u scroll_page_up
map --mode scrollmode g scroll_home
map --mode scrollmode G scroll_end

map --mode scrollmode esc pop_keyboard_mode
map --mode scrollmode enter pop_keyboard_mode
map --mode scrollmode alt+s pop_keyboard_mode


# ----------------------------
# OPACITY MODE  (enter with alt+o)
# ----------------------------
map --new-mode opacitymode alt+o

map --mode opacitymode - set_background_opacity -0.05
map --mode opacitymode = set_background_opacity +0.05
map --mode opacitymode 0 set_background_opacity default

map --mode opacitymode esc pop_keyboard_mode
map --mode opacitymode enter pop_keyboard_mode
map --mode opacitymode alt+o pop_keyboard_mode


# ----------------------------
# LOCK MODE  (enter with alt+g)
# ----------------------------
# In this mode, unknown keys pass through to the program running in the
# active window instead of triggering kitty mappings. That lets you use
# shell/app shortcuts that would otherwise conflict with your leader keys.
map --new-mode locked --on-unknown passthrough alt+g
map --mode locked alt+shift+g pop_keyboard_mode

# map alt+alt+b launch --type os-panel --os-panel edge=bottom --os-panel lines=2 --os-panel focus-policy=exclusive --keep-focus python3 ~/.config/kitty/panel_status.py
#
# --target=window opens each session in a new OS window; use --target=tab (or
# drop the flag) to open it as a tab in the current window instead.
map ctrl+a>k launch --type=overlay $HOME/.config/kitty/session-management/kitty-zoxide-sessions.py --target=window --auto-close --ansi
map ctrl+a>a launch --type=overlay --allow-remote-control $HOME/.config/kitty/session-management/attention-picker.py --ansi
# Overview of every agent across all sessions, with a live preview of its screen
map ctrl+a>o launch --type=overlay --allow-remote-control $HOME/.config/kitty/session-management/agent-overview.py --ansi

# Cycle through open sessions
map alt+] launch --type=background --copy-env --allow-remote-control sh -c 'python3 "$HOME/.config/kitty/session-management/cycle-session.py" >> /tmp/kitty-cycle-session.log 2>&1'
map alt+[ launch --type=background --copy-env --allow-remote-control sh -c 'python3 "$HOME/.config/kitty/session-management/cycle-session.py" --prev >> /tmp/kitty-cycle-session.log 2>&1'
# Toggle the tab bar between the bottom strip and a vertical sidebar
map ctrl+a>v launch --type=background --copy-env --allow-remote-control sh -c 'python3 "$HOME/.config/kitty/tab_bar/toggle-edge.py" >> /tmp/kitty-tab-bar-edge.log 2>&1'
map ctrl+a>g launch --type=overlay --cwd=current lazygit
map ctrl+a>d launch --type=overlay --cwd=current lazydocker
map ctrl+a>b launch --type=overlay --cwd=current btop
