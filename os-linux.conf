bell_path /usr/share/sounds/freedesktop/stereo/bell.oga
listen_on unix:@kitty-{kitty_pid}
map kitty_mod+i launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay /bin/zsh -c 'nvim +$ +"nnoremap q ZQ" +"call nvim_open_term(0, {})" +"set number relativenumber" +"$" -'

# Scrollback as MARKDOWN (kitty_mod+m): pipe scrollback into a real .md file
# and open it so render-markdown.nvim + diagram.nvim + image.nvim all fire on
# BufRead. Tell Claude to print ```mermaid fences and ![](/abs/path.png) links
# and they render inline. No --stdin-add-formatting: we want plain text, not
# ANSI escapes (which would show as literal garbage in a markdown buffer).
map kitty_mod+m launch --stdin-source=@screen_scrollback --type=overlay /bin/zsh -c 'f=$(mktemp --suffix=.md); cat > "$f"; nvim +"nnoremap q ZQ" +"$" "$f"; rm -f "$f"'
