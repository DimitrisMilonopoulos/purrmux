font_family      JetBrainsMono Nerd Font
font_size         13.0
enable_audio_bell true
window_alert_on_bell yes
bell_on_tab "🔔 "
# Custom tab bar entry point: tab_bar.py loads the tab_bar/ package.
tab_bar_style custom
tab_bar_edge    bottom
tab_bar_margin_width    0
tab_bar_margin_height    5 0
visual_bell_duration 0.3
tab_fade    0
tab_bar_filter session:~ or session:^$
tab_bar_align center
tab_bar_min_tabs 1
background_opacity 0.8
shell fish
allow_remote_control yes
dynamic_background_opacity yes
include os-${KITTY_OS}.conf
startup_session session-management/startup.kitty-session
cursor_trail 1
cursor_trail_decay 0.2 0.5
cursor_start_trail_threshold 3
wheel_scroll_multiplier 4.0
modify_font cell_height 110%
scrollback_lines 2000

include keybinds.conf

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# User overrides — create override.conf next to this file to change any setting.
# Missing file is silently ignored; the glob matches nothing.
globinclude override.conf
