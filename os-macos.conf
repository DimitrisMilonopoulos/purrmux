listen_on unix:/tmp/mykitty-{kitty_pid}

# keybinds.conf's quick tier is Alt-based (alt+hjkl, alt+[ / alt+]), and kitty's
# default here is `macos_option_as_alt no`, which sends Option as Unicode input
# instead — leaving those six dead. The cost is Option-composed characters
# (é, ü); use `macos_option_as_alt left` in override.conf to keep right-Option
# for input. The ctrl+g leader works either way.
macos_option_as_alt yes

# kitty defines cmd+t / cmd+enter on macOS as plain new_tab / new_window, which
# skip the cwd-aware overrides keybinds.conf puts on ctrl+shift+t and
# ctrl+shift+enter. Repoint them so new tabs and windows join the current
# session whichever key you reach for.
map cmd+t new_tab_with_cwd
map cmd+enter new_window_with_cwd
