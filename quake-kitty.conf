# Minimal kitty config used *inside* the quake dropdowns.
#
# This file is the reason the quakes have no sidebar. A tab bar is an instance
# wide option — kitty reads tab_bar_min_tabs from the global options for every
# OS window it lays out, and tab_bar_filter can't stand in for it because the
# active tab is always exempt (see tab_bar/toggle-edge.py, which had to work
# this out the hard way). So a window with no tab bar has to be a kitty with no
# tab bar, which is what this is: theme and font, nothing else. No startup
# session, no tab bar package, no keyboard modes — none of which a single
# window fzf picker needs.
#
# bin/quake starts the instance with this as its `--config`, and the panel
# geometry rides on the launch command rather than living in a config file of
# its own. Note what it leaves out as much as what it sets: no `listen_on` here
# either — bin/quake passes each instance a *named* socket, so a quake can
# never be mistaken for the main instance by the pickers, which look for the
# `@kitty-<pid>` form.

font_family      JetBrainsMono Nerd Font
font_size        13.0
modify_font cell_height 110%

# Match the active theme of the main instance.
include current-theme.conf
