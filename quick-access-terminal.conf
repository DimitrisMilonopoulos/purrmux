# Quake-style dropdown that hosts the kitty-zoxide session picker.
#
# Bring it up from anywhere with a global compositor hotkey running:
#
#   kitten quick-access-terminal \
#       python3 ~/.config/kitty/session-management/kitty-zoxide-sessions.py \
#       --ansi --target=window --main-listen-on auto
#
# The picker runs inside this dropdown (its own kitty process), so it uses
# `--main-listen-on auto` to drive the *main* instance over remote control:
# goto_session creates/focuses the chosen session's OS window in the main
# instance, that window grabs focus, and `hide_on_focus_loss` tucks this
# dropdown away again. When the picker exits the dropdown closes on its own.

# Geometry: full-width sheet dropping from the top.
# NB: this kitten config is currently UNUSED — the SUPER+slash session picker
# now launches as a normal centered floating kitty window (class `quake`) so it
# gets a real Hyprland border, not as this layer-shell dropdown. Kept here in
# case you want the edge-anchored dropdown back. See hypr/binds.lua + rules.lua.
edge top
lines 30
background_opacity 0.95

# Auto-hide as soon as a session window steals focus (forces focus_policy
# on-demand, which is what we want for a transient picker).
hide_on_focus_loss yes

# Don't preload it at login; it spawns on first hotkey press.
start_as_hidden no

# Keep the dropdown lean: theme + font only, no startup session / tab bar.
kitty_conf quick-access-terminal-kitty.conf
